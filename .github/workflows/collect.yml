name: collect

on:
  schedule:
    # 22:45 UTC is 18:45 ET during US daylight time and 17:45 ET during standard time: in both cases after the 16:00 close.
    # GitHub may start scheduled runs several minutes late. Times are always UTC.
    - cron: "45 22 * * 1-5"
    # Second slot 30 minutes later. The collector is idempotent (an already collected day is skipped), so this only helps
    # when the first run was delayed or failed for a transient reason.
    - cron: "15 23 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols, e.g. SPX,NDX (empty = all from config.json)"
        required: false
        default: ""
      force:
        description: "Run on a closed day and accept stale data (testing only)"
        type: boolean
        default: false
      allow_intraday:
        description: "Accept a snapshot taken before 16:30 ET (marked in the file)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the data files
  issues: write     # open an issue when a run fails

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        continue-on-error: true      # data of the symbols that worked is still committed below; failure is reported afterwards
        shell: bash
        env:
          SYMBOLS: ${{ inputs.symbols }}
          FORCE: ${{ inputs.force }}
          INTRADAY: ${{ inputs.allow_intraday }}
        run: |
          args=(--out data)
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$INTRADAY" = "true" ]; then args+=(--allow-intraday); fi
          python src/collect.py "${args[@]}" 2>&1 | tee collect.log

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: collected $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git pull --rebase && git push; then break; fi
              sleep $((i * 5))
            done
          fi

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows of a public repository after 60 days without repository activity.
        # Normally the daily data commits are activity; this empty commit is a safety net for long quiet periods.
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            git commit --allow-empty -m "chore: keepalive (no data changes for 30 days)"
            git push
          fi

      - name: Report failure
        if: steps.collect.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Collector failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n```\n'"$(tail -n 40 collect.log)"$'\n```'
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          exit 1

      - name: Close the failure issue after recovery
        if: steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search '"Collector failed" in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
